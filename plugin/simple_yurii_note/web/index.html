<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simple_yurii_note</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="open-btn" title="vault を開く">📂 開く</button>
      <span id="vault-name" class="vault-name">vault 未選択</span>
      <span class="spacer"></span>
      <button id="new-btn" title="子ノートを作成">＋ ノート</button>
      <button id="new-group-btn" title="グループを作成">＋ グループ</button>
      <button id="delete-btn" title="このノートを削除">🗑</button>
      <button id="save-btn" title="保存 (Ctrl+S)" disabled>保存</button>
      <span id="save-state" class="save-state">—</span>
      <button id="theme-btn" title="ライト / ダーク切替">🌙</button>
    </header>

    <main id="layout">
      <aside id="sidebar">
        <div class="side-head">
          <input id="search" type="search" placeholder="検索 / クイックオープン (Ctrl+O)">
        </div>
        <div id="note-list" class="note-list"></div>
      </aside>

      <section id="center">
        <div id="tabs" class="tabs"></div>
        <div id="note-view" hidden>
          <input id="title-input" class="title-input" disabled>
          <div id="editor" class="editor"></div>
        </div>
        <div id="empty" class="empty">📂 を押して vault（~/files/yurii-note）を開いてください。</div>
      </section>

      <aside id="relations">
        <div id="rel-parent" class="rel-block"></div>
        <div id="rel-children" class="rel-block"></div>
        <div id="rel-back" class="rel-block"></div>
      </aside>
    </main>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box">
      <h2>simple_yurii_note</h2>
      <p id="overlay-msg"></p>
      <button id="overlay-open" class="primary">vault を開く</button>
      <button id="overlay-pick" style="display:none"></button>
      <p class="hint">Electron アプリとして起動するのが既定です（Vim で <b>\A</b> / <code>npm run app</code>）。</p>
    </div>
  </div>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>

  <script src="bundle.js"></script>
</body>
</html>
